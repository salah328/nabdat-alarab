<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شات غرف نبضات العرب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #e5e5e5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* شريط التحكم العلوي */
        .header-bar { background-color: #631243; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; border-bottom: 2px solid #4a0d32; }
        .room-dropdown { background-color: #ffd700; color: #000; border: none; padding: 5px 10px; border-radius: 10px; font-weight: bold; font-size: 13px; outline: none; }
        .toggle-users-btn { background-color: #4a0d32; color: #fff; border: 1px solid #ffd700; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; }

        /* منطقة المحتوى الرئيسية */
        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        /* قائمة المتواجدين الجانبية الفخمة المطابقة لصورتك */
        .users-sidebar { width: 100%; max-width: 320px; background-color: #ffffff; border-left: 2px solid #631243; display: flex; flex-direction: column; overflow-y: auto; padding: 10px; position: absolute; left: 0; top: 0; height: 100%; z-index: 10; box-shadow: 5px 0 15px rgba(0,0,0,0.2); }
        
        /* شريط إغلاق القائمة والبحث */
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #ddd; }
        .close-sidebar-btn { background: none; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: #333; }
        
        /* 🟢 عداد المتصلين الأخضر مثل صورتك بالملي */
        .online-counter-badge { background-color: #008744; color: #ffffff; text-align: center; padding: 8px; border-radius: 5px; font-weight: bold; font-size: 14px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* 👑 كرت المستخدم الفخم الملون والمطابق للصورة */
        .user-card-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 25px; margin-bottom: 10px; position: relative; overflow: hidden; min-height: 65px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 6px rgba(0,0,0,0.15); color: #fff; }
        
        /* توزيع الألوان الفخمة عشوائياً للبطاقات */
        .bg-purple { background: linear-gradient(45deg, #4b0082, #8a2be2); }
        .bg-blue { background: linear-gradient(45deg, #002244, #004488); }
        .bg-dark { background: linear-gradient(45deg, #111111, #222222); }
        .bg-space { background: linear-gradient(45deg, #0d0d2b, #2b0d2d); }

        /* التفاصيل الجانبية (النص على اليمين والصورة على اليسار) */
        .user-card-right { display: flex; align-items: center; gap: 8px; }
        .delete-user-icon { color: #5bc0de; font-size: 16px; cursor: pointer; }
        .crown-icon { color: #ffd700; font-size: 16px; }
        
        .user-text-info { display: flex; flex-direction: column; gap: 2px; text-align: right; }
        .user-card-name { font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .user-card-status { font-size: 10px; color: #e0e0e0; font-weight: normal; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* محاذاة الصورة الشخصية والإطار جهة اليسار */
        .user-card-left { position: relative; width: 45px; height: 45px; flex-shrink: 0; margin-left: 5px; }
        .user-card-avatar { width: 100%; height: 100%; border-radius: 50%; background-color: #eee; object-fit: cover; border: 2px solid #fff; }
        .user-card-frame { position: absolute; top: -3px; left: -3px; width: 51px; height: 51px; border: 2px solid #ffd700; border-radius: 50%; box-shadow: 0 0 5px #ffd700; }

        /* شريط الكتابة السفلي */
        .input-bar { background-color: #631243; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #4a0d32; z-index: 5; }
        .input-field { flex: 1; background-color: #fff; border: none; padding: 10px 15px; border-radius: 20px; font-size: 14px; outline: none; }
        .btn-send { background: none; border: none; color: white; font-size: 20px; cursor: pointer; transform: rotate(180deg); }
        .user-name-input { width: 30%; background-color: #fff; border: none; padding: 8px; border-radius: 10px; font-size: 12px; outline: none; }
    </style>
</head>
<body>

    <!-- شريط الرتب والغرف العلوي -->
    <div class="header-bar">
        <div>
            <select id="roomSelect" class="room-dropdown">
                <option value="المنصة العامة">المنصة العامة 👑</option>
                <option value="غرفة الأثرياء">غرفة الأثرياء 💎</option>
                <option value="غرفة المسابقات">غرفة المسابقات 🎉</option>
            </select>
        </div>
        <button id="toggleUsersBtn" class="toggle-users-btn">👥 الزوار (0)</button>
    </div>

    <!-- منطقة المحتوى المشتركة -->
    <div class="main-container">
        <!-- ساحة المحادثة الفورية المتتالية -->
        <div class="chat-area" id="chatArea"></div>

        <!-- قائمة أسماء زوار المطور المطابقة لصورتك بالملي -->
        <div class="users-sidebar" id="usersSidebar" style="display: none;">
            <div class="sidebar-header">
                <button id="closeSidebarBtn" class="close-sidebar-btn">✕</button>
                <span style="font-weight: bold; font-size: 14px; color: #333;">قائمة الزوار</span>
            </div>
            
            <!-- عداد متصل الأخضر -->
            <div class="online-counter-badge" id="onlineBadge">👥 متصل 0</div>
            
            <div id="usersList">
                <!-- كروت زوار الشات ستظهر هنا تلقائياً بتصميمها الملون واللامع -->
            </div>
        </div>
    </div>

    <!-- شريط الكتابة السفلي المطور -->
    <div class="input-bar">
        <input type="text" id="usernameInput" class="user-name-input" placeholder="اسمك المزخرف...">
        <input type="text" id="msgInput" class="input-field" placeholder="اكتب هنا...">
        <button id="sendBtn" class="btn-send">➔</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatArea = document.getElementById('chatArea');
        const usernameInput = document.getElementById('usernameInput');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const roomSelect = document.getElementById('roomSelect');
        const usersList = document.getElementById('usersList');
        const toggleUsersBtn = document.getElementById('toggleUsersBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const usersSidebar = document.getElementById('usersSidebar');
        const onlineBadge = document.getElementById('onlineBadge');

        let currentRoom = roomSelect.value;
        let myName = 'زائر نبضات';
        const bgClasses = ['bg-purple', 'bg-blue', 'bg-dark', 'bg-space']; 

        toggleUsersBtn.addEventListener('click', () => { usersSidebar.style.display = 'flex'; });
        closeSidebarBtn.addEventListener('click', () => { usersSidebar.style.display = 'none'; });

        function joinRoom() {
            myName = usernameInput.value.trim() || 'زائر ' + Math.floor(Math.random() * 100);
            socket.emit('joinRoom', { username: myName, room: currentRoom });
        }

        roomSelect.addEventListener('change', (e) => {
            currentRoom = e.target.value;
            joinRoom();
        });

        sendBtn.addEventListener('click', () => {
            const msg = msgInput.value.trim();
            const inputName = usernameInput.value.trim();
            if(inputName && inputName !== myName) {
                myName = inputName;
                socket.emit('joinRoom', { username: myName, room: currentRoom });
            }
            if(msg) {
                socket.emit('chatMessage', { name: myName, msg: msg, room: currentRoom });
                msgInput.value = '';
            }
        });

        socket.on('message', (data) => {
            chatArea.innerHTML += `
                <div style="display: flex; align-items: flex-start; gap: 12px; width: 100%;">
                    <div style="position: relative; width: 50px; height: 50px; flex-shrink: 0;">
                        <div style="position: absolute; top: -4px; left: -4px; width: 58px; height: 58px; border: 2px dashed #ffd700; border-radius: 50%;"></div>
                        <div style="width: 100%; height: 100%; border-radius: 50%; background-color: #bbb; border: 2px solid #ccc;"></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start;">
                        <div style="background-color: #111; color: #fff; padding: 6px 20px; border-radius: 15px; font-weight: bold; font-size: 13px; min-width: 140px; text-align: center;">${data.name}</div>
                        <div style="color: #333; font-size: 14px; font-weight: 600; padding-right: 8px;">${data.msg}</div>
                    </div>
                </div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        });

        socket.on('roomUsers', ({ room, users }) => {
            if (room === currentRoom) {
                toggleUsersBtn.innerText = `👥 الزوار (${users.length})`;
                onlineBadge.innerText = `👥 متصل ${users.length}`;
                usersList.innerHTML = '';
                
                users.forEach((user, index) => {
